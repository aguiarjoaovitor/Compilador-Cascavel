<text text-anchor="start" x="114" y="-134.2" font-family="Arial" font-weight="bold" font-size="11.00">Imagem 1: Identificador / Reservada</text>
<text text-anchor="start" x="132" y="-114.2" font-family="Arial" font-weight="bold" font-size="11.00">Regex:</text>
<text text-anchor="start" x="177" y="-113.2" font-family="Courier New" font-size="11.00">l(l+d+u)*</text>
<text text-anchor="start" x="162" y="-94.2" font-family="Courier New" font-weight="bold" font-size="11.00">l</text>
<text text-anchor="start" x="177" y="-93.2" font-family="Arial" font-size="11.00">letra ASCII (a–z, A–Z)</text>
<text text-anchor="start" x="162" y="-74.2" font-family="Courier New" font-weight="bold" font-size="11.00">d</text>
<text text-anchor="start" x="177" y="-73.2" font-family="Arial" font-size="11.00">dígito (0–9)</text>
<text text-anchor="start" x="162" y="-54.2" font-family="Courier New" font-weight="bold" font-size="11.00">u</text>
<text text-anchor="start" x="177" y="-53.2" font-family="Arial" font-size="11.00">_ (underscore)</text>
<text text-anchor="start" x="15" y="-33.2" font-family="Arial" font-size="11.00">Em ID_S1: lexema na tabela de reservadas → token da reservada; senão → ID.</text>
<text text-anchor="start" x="27.5" y="-13.2" font-family="Arial" font-size="11.00">Transição ausente: em aceitação = emite o token; em não aceitação = erro.</text>

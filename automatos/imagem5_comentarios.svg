<polygon fill="white" stroke="transparent" points="-4,4 -4,-590.89 837.52,-590.89 837.52,4 -4,4"/>
<text text-anchor="start" x="354.26" y="-194.2" font-family="Arial" font-weight="bold" font-size="11.00">Imagem 5: Comentários</text>
<text text-anchor="start" x="255.76" y="-174.2" font-family="Arial" font-weight="bold" font-size="11.00">Regex:</text>
<text text-anchor="start" x="300.76" y="-173.2" font-family="Courier New" font-size="11.00">h((o+h)(o+h+s)*+$+s(o+h+n+ss*(o+n))*ss*h)</text>
<text text-anchor="start" x="285.76" y="-154.2" font-family="Courier New" font-weight="bold" font-size="11.00">h</text>
<text text-anchor="start" x="300.76" y="-153.2" font-family="Arial" font-size="11.00"># (cerquilha)</text>
<text text-anchor="start" x="285.76" y="-134.2" font-family="Courier New" font-weight="bold" font-size="11.00">s</text>
<text text-anchor="start" x="300.76" y="-133.2" font-family="Arial" font-size="11.00">* (asterisco)</text>
<text text-anchor="start" x="285.76" y="-114.2" font-family="Courier New" font-weight="bold" font-size="11.00">n</text>
<text text-anchor="start" x="300.76" y="-113.2" font-family="Arial" font-size="11.00">\n (quebra de linha)</text>
<text text-anchor="start" x="285.76" y="-94.2" font-family="Courier New" font-weight="bold" font-size="11.00">o</text>
<text text-anchor="start" x="300.76" y="-93.2" font-family="Arial" font-size="11.00">qualquer outro, exceto # &#160;* &#160;e \n</text>
<text text-anchor="start" x="285.76" y="-74.2" font-family="Courier New" font-weight="bold" font-size="11.00">$</text>
<text text-anchor="start" x="300.76" y="-73.2" font-family="Arial" font-size="11.00">ε (vazio)</text>
<text text-anchor="start" x="216.76" y="-53.2" font-family="Arial" font-size="11.00">Aceitação = descarta o comentário e volta ao início (comentários não geram token).</text>
<text text-anchor="start" x="224.26" y="-33.2" font-family="Arial" font-size="11.00">Em COM_HASH e COM_LINHA, o n encerra o comentário sem ser consumido.</text>
<text text-anchor="start" x="225.76" y="-13.2" font-family="Arial" font-size="11.00">Transição ausente: em aceitação = fim do comentário; em não aceitação = erro.</text>
<polygon fill="none" stroke="#999999" points="209.76,-4 209.76,-208 623.76,-208 623.76,-4 209.76,-4"/>
